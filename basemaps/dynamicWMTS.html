<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dynamic WMTS Layer (Sentinel-2 / EOX)</title>
<script src="https://cdn.jsdelivr.net/gh/svgmap/svgmapjs@latest/svgMapLayerLib.js"></script>
<script>
	// Dynamic WMTS (web mercator based) Layer for SVGMap
	
	// License: (MPL v2)
	// This Source Code Form is subject to the terms of the Mozilla Public
	// License, v. 2.0. If a copy of the MPL was not distributed with this
	// file, You can obtain one at https://mozilla.org/MPL/2.0/.
	
	// 2013/01/24 : 1st ver.
	// 2026/8/26: Modernized to S-LaWA architecture
	// 2026/10/31: Add ui, newer datasets, and improve projection.
	
	
	var maxLevel = 18;
	var minLevel = 3;
	var tilePix = 256;

	var highPrecisionProjection = false; // 高精度図法の有効化

	// 言語判定
	var isJa = (navigator.language || navigator.userLanguage || "").toLowerCase().indexOf("ja") === 0;

	// WMTSレイヤ定義（旧16件 + 先頭に2024〜2020年次）
	var layers = [
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2024_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.jpg", ja: "Sentinel-2 雲なし衛星画像 (2024年 最新)", en: "Sentinel-2 Cloudless (2024 Latest)" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2023_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.jpg", ja: "Sentinel-2 雲なし衛星画像 (2023年)", en: "Sentinel-2 Cloudless (2023)" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2022_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.jpg", ja: "Sentinel-2 雲なし衛星画像 (2022年)", en: "Sentinel-2 Cloudless (2022)" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.jpg", ja: "Sentinel-2 雲なし衛星画像 (2020年)", en: "Sentinel-2 Cloudless (2020)" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2018_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.jpg", ja: "Sentinel-2 雲なし衛星画像 (2018年)", en: "Sentinel-2 Cloudless (2018)" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/osm_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.jpg", ja: "OpenStreetMap (標準地図)", en: "OpenStreetMap" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.jpg", ja: "Sentinel-2 雲なし衛星画像 (2016年)", en: "Sentinel-2 Cloudless (2016)" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/terrain_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.jpg", ja: "Terrain (地形図 陰影)", en: "Terrain (Hillshading)" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/overlay_base_bright_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.png", ja: "Overlay Base Bright (境界のみ 明色)", en: "Overlay Base Bright (Boundaries)" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/graticules/default/WGS84/{TileMatrix}/{TileRow}/{TileCol}.png", ja: "Graticules (経緯度線)", en: "Graticules (Grid)" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/overlay_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.png", ja: "Overlay (地名・境界)", en: "Overlay (Labels & Boundaries)" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/streets_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.png", ja: "Streets (道路網)", en: "Streets Overlay" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2017_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.jpg", ja: "Sentinel-2 雲なし衛星画像 (2017年)", en: "Sentinel-2 Cloudless (2017)" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/blackmarble_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.jpg", ja: "BlackMarble (夜間の地球)", en: "BlackMarble (Night Lights)" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/hydrography_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.png", ja: "Hydrography (水系・河川・湖)", en: "Hydrography (Rivers & Lakes)" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/terrain-light_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.jpg", ja: "Terrain Light (地形図 淡色)", en: "Terrain Light" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/bluemarble_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.jpg", ja: "BlueMarble (NASA 地球画像)", en: "BlueMarble (NASA Earth)" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/overlay_base_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.png", ja: "Overlay Base (境界のみ)", en: "Overlay Base (Boundaries)" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/overlay_bright_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.png", ja: "Overlay Bright (地名・境界 明色)", en: "Overlay Bright (Labels & Boundaries)" },
		{ url: "https://tiles.maps.eox.at/wmts/1.0.0/coastline_3857/default/g/{TileMatrix}/{TileRow}/{TileCol}.png", ja: "Coastline (海岸線)", en: "Coastline" }
	];
	var svAddrs = layers.map(function(l) { return l.url; });
	var svAddr = svAddrs[0];
	var currentLayerIdx = 0;

	// サブレイヤ切り替え（タイル初期化 + hash更新）
	function switchLayer(idx, updateHash) {
		if (idx < 0 || idx >= layers.length) return;
		currentLayerIdx = idx;
		svAddr = svAddrs[idx];

		// UI同期
		var sel = document.getElementById("layerSelect");
		if (sel && Number(sel.value) !== idx) {
			sel.value = idx;
		}

		// 既存のタイル(image要素)をすべて消去して初期化
		if (typeof svgImage !== "undefined" && svgImage) {
			var currentTiles = svgImage.getElementsByTagName("image");
			for (var i = currentTiles.length - 1; i >= 0; i--) {
				currentTiles[i].parentNode.removeChild(currentTiles[i]);
			}
		}

		// 再描画
		if (typeof svgMap !== "undefined" && svgMap.refreshScreen) {
			svgMap.refreshScreen();
		}
		if (typeof putGlobalMessage === "function") {
			putGlobalMessage("© " + (isJa ? layers[idx].ja : layers[idx].en) + " by EOX");
		}

		// hash更新（先頭の '#' を維持）
		if (updateHash) {
			var h = (typeof svgImageProps !== "undefined" && svgImageProps && svgImageProps.hash) ? svgImageProps.hash : location.hash;
			if (h && h.indexOf("#") === 0) h = h.substring(1);
			var params = h ? h.split("&").filter(function(p) { return p.indexOf("map=") !== 0 && p.length > 0; }) : [];
			params.push("map=" + idx);
			var newHash = "#" + params.join("&");
			if (typeof svgImageProps !== "undefined" && svgImageProps) {
				svgImageProps.hash = newHash;
			}
			try { history.replaceState(null, "", newHash); } catch(e) {}
		}
	}

	// UI初期化
	function initUI() {
		var sel = document.getElementById("layerSelect");
		var lbl = document.getElementById("layerLabel");
		if (lbl) {
			lbl.textContent = isJa ? "背景レイヤ: " : "Layer: ";
		}
		if (!sel) return;
		sel.innerHTML = "";
		layers.forEach(function(l, i) {
			var opt = document.createElement("option");
			opt.value = i;
			opt.textContent = isJa ? l.ja : l.en;
			if (i === currentLayerIdx) opt.selected = true;
			sel.appendChild(opt);
		});
		sel.addEventListener("change", function() {
			switchLayer(Number(sel.value), true);
		});
	}

	// SVGMapのレイヤーとして読み込まれた際の初期化処理
	addEventListener("layerWebAppReady", function() {
		var targetIdx = 0;

		// URLフラグメントからレイヤー設定を引き継ぐ
		if (svgImageProps && svgImageProps.hash) {
			var hParams = getHashParams(svgImageProps.hash);
			
			if (hParams.map && typeof(hParams.map) !== "function") {
				if (!isNaN(hParams.map)) {
					// インデックス指定の場合
					var idx = Number(hParams.map);
					if (idx >= 0 && idx < svAddrs.length) {
						targetIdx = idx;
					}
				} else {
					// 文字列による部分一致指定の場合
					for (var i = 0; i < svAddrs.length; i++) {
						if (svAddrs[i].indexOf(hParams.map) >= 0) {
							targetIdx = i;
							break;
						}
					}
				}
			}
		}
		
		initUI();
		switchLayer(targetIdx, false);
	});

	// ハッシュパラメータの解析関数
	function getHashParams(hash) {
		if (hash.indexOf("#") === 0) {
			hash = hash.substring(1);
		}
		var params = {};
		var parts = hash.split("&");
		for (var i = 0; i < parts.length; i++) {
			var pair = parts[i].split("=");
			if (pair[1] !== undefined) {
				params[pair[0]] = pair[1];
			} else {
				params[pair[0]] = true;
			}
		}
		return params;
	}

	// ズーム/スクロール等、再描画の直前に呼ばれるコールバック
	function preRenderFunction() {
		var level = Math.floor(Math.LOG2E * Math.log(svgImageProps.scale) + 7.5);
		if (level > maxLevel) {
			level = maxLevel;
		} else if (level < minLevel) {
			level = minLevel;
		}
		
		var tileSet = getTileSet(svgMap.getGeoViewBox(), level);
		
		var currentTiles = svgImage.getElementsByTagName("image");
		
		for (var i = currentTiles.length - 1; i >= 0; i--) {
			var oneTile = currentTiles[i];
			var qkey = oneTile.getAttribute("metadata");
			if (tileSet[qkey]) {
				tileSet[qkey].exist = true;
			} else {
				oneTile.parentNode.removeChild(oneTile);
			}
		}
		
		for (var tkey in tileSet) {
			if (!tileSet[tkey].exist) {
				var addTiles = getTile(tileSet[tkey].x, tileSet[tkey].y, level, this.CRS);
				for ( var i = 0 ; i < addTiles.length ; i++ ){  
					svgImage.getElementsByTagName("svg")[0].appendChild(addTiles[i]);
				}
			}
		}
	}

	// 歪み補正のためのパラメータ  
	var maxSubdivideDepth = 3;      // 最大再帰深さ（最大8分割）  
	var distortionThreshold = 0.01; // 区間高に対する中点ズレの許容率  
	if ( !highPrecisionProjection ){
		maxSubdivideDepth = 0;
	}
	
	// 指定された場所のタイル(分割された地図イメージ)を取得  
	// メルカトル由来の緯度方向の非線形歪みが大きい区間を再帰的に二等分し、  
	// #xywh= によるクリップで各区間を正しい地理座標に配置する  
	function getTile( tileX ,  tileY , level , crs ){  
		var tileURL = getWMTSURL( tileX , tileY , level);  
		var imgs = new Array();  
		var pxLeft   = tileX * tilePix;  
		var pxRight  = tileX * tilePix + tilePix;  
  
		// タイル全体のSVG座標高（判定の分母として固定）  
		var tTop0 = XY2latLng( pxLeft , tileY * tilePix , level );  
		var sTop0 = svgMap.transform( tTop0.lng , tTop0.lat , crs );  
		var tBR0  = XY2latLng( pxRight , tileY * tilePix + tilePix , level );  
		var sBR0  = svgMap.transform( tBR0.lng , tBR0.lat , crs );  
		var tileHeight = Math.abs( sBR0.y - sTop0.y );  
  
		subdivideTile( tileY * tilePix , tileY * tilePix + tilePix , 0 );  
		//console.log("tile:",{tileX ,  tileY , level},imgs.length);
		return imgs;  
  
		function subdivideTile( pyTop , pyBottom , depth ){  
			var tTop = XY2latLng( pxLeft , pyTop , level );  
			var sTop = svgMap.transform( tTop.lng , tTop.lat , crs );  
			var tBR  = XY2latLng( pxRight , pyBottom , level );  
			var sBR  = svgMap.transform( tBR.lng , tBR.lat , crs );  
  
			var tMid = XY2latLng( pxLeft , (pyTop + pyBottom) / 2 , level );  
			var sMid = svgMap.transform( tMid.lng , tMid.lat , crs );  
			var deviation = Math.abs( sMid.y - (sTop.y + sBR.y) / 2 );  
  
			// タイル全体高に対する絶対的なズレ率で判定  
			if ( depth < maxSubdivideDepth  
				&& deviation > tileHeight * distortionThreshold ){  
				var pyMid = (pyTop + pyBottom) / 2;  
				subdivideTile( pyTop , pyMid , depth + 1 );  
				subdivideTile( pyMid , pyBottom , depth + 1 );  
				return;  
			}
			// 葉区間：<image>を生成し #xywh= で元タイルの該当ピクセル帯を指定  
			var cl = svgImage.createElement("image");  
			cl.setAttribute("x" , sTop.x);  
			cl.setAttribute("y" , sTop.y);  
			cl.setAttribute("width" , sBR.x - sTop.x);  
			cl.setAttribute("height" , sBR.y - sTop.y);  
			if ( depth == 0 ){  
				cl.setAttribute("xlink:href" , tileURL.URL);  
			} else {
				cl.setAttribute("xlink:href" , tileURL.URL + "#xywh=0,"  
					+ (pyTop - tileY * tilePix) + "," + tilePix + "," + (pyBottom - pyTop));  
			}
			cl.setAttribute("metadata" , tileURL.Key);  
			cl.setAttribute("data-mercator-tile" , "true");  
			imgs.push( cl );  
		}  
	}
	
	function getTileSet(geoViewBox, level) {
		var TileSet = new Object();
		
		// Webメルカトルの緯度限界クリッピング
		if (geoViewBox.y + geoViewBox.height > 85.05113) {
			geoViewBox.height = 85.05113 - geoViewBox.y;
		}
		if (geoViewBox.y < -85.05113) {
			geoViewBox.y = -85.05113;
		}
		
		var tlxy = latLng2XY(geoViewBox.y + geoViewBox.height, geoViewBox.x, level);
		var tileTLxy = XY2TileXY(tlxy);
		var brxy = latLng2XY(geoViewBox.y, geoViewBox.x + geoViewBox.width, level);
		var tileBRxy = XY2TileXY(brxy);
		
		for (var i = tileTLxy.y; i <= tileBRxy.y; i++) {
			for (var j = tileTLxy.x; j <= tileBRxy.x; j++) {
				var qkey = getKey(j, i, level);
				TileSet[qkey] = new Object();
				TileSet[qkey].x = j;
				TileSet[qkey].y = i;
			}
		}
		return TileSet;
	}

	function latLng2XY(lat, lng, lvl) {
		var size = lvl2Res(lvl);
		var sinLat = Math.sin(lat * Math.PI / 180.0);
		var pixelX = ((lng + 180.0) / 360.0) * size;
		var pixelY = (0.5 - Math.log((1 + sinLat) / (1.0 - sinLat)) / (4 * Math.PI)) * size;
		return { x: pixelX, y: pixelY };
	}

	function XY2TileXY(xy) {
		var tileX = Math.floor(xy.x / tilePix);
		var tileY = Math.floor(xy.y / tilePix);
		return { x: tileX, y: tileY };
	}

	function lvl2Res(lvl) {
		var j = 1;
		for (var i = 0; i < lvl; i++) {
			j = j * 2;
		}
		return (j * tilePix);
	}

	function XY2latLng(px, py, lvl) {
		var size = lvl2Res(lvl);
		var x = (px / size) - 0.5;
		var y = 0.5 - (py / size);
		var lat = 90 - 360 * Math.atan(Math.exp(-y * 2 * Math.PI)) / Math.PI;
		var lng = 360 * x;
		return { lat: lat, lng: lng };
	}

	function getWMTSURL(tx, ty, lvl) {
		var tile_ans = getKey(tx, ty, lvl);
		var mapServerURL = svAddr.replace("{TileMatrix}", lvl);
		mapServerURL = mapServerURL.replace("{TileRow}", ty);
		mapServerURL = mapServerURL.replace("{TileCol}", tx);
		return {
			URL: mapServerURL,
			Key: tile_ans
		}
	}
	
	function getKey(tx, ty, lvl) {
		return (tx + "_" + ty + "_" + lvl);
	}
</script>
</head>
<body>
<h3>Dynamic WMTS Layer (Sentinel-2 / EOX)</h3>
<p><label><span id="layerLabel">Layer: </span><select id="layerSelect"></select></label></p>
