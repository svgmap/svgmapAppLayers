<!DOCTYPE html>
<html>
	<head>
		<title>JTWC</title>
	</head>

	<script src="https://cdn.jsdelivr.net/gh/svgmap/svgmapjs@latest/svgMapLayerLib.js"></script>
	<script>
	// Description: 
	// JTWCレイヤー (X/Y独立スケール解析版)
	// 
	// License: (MPL v2)
	// This Source Code Form is subject to the terms of the Mozilla Public
	// License, v. 2.0. If a copy of the MPL was not distributed with this
	// file, You can obtain one at https://mozilla.org/MPL/2.0/.
	//
	// 2021/6/8 画像認識ルーチンを組み込んで位置合わせ
	// 2023/8/8 画像認識ルーチンを刷新
	// 　10度おきの緯線をfftで破線認識させることで、少し信頼性を上げた。
	// 　赤道は水色の線を使って認識させる

	// 2023/8/10 緯線破線のピッチの想定範囲を使いフィルタ
	// 大ISSUE!!! JTWC、出力画像の解像度がものすごくバラツキ、小さい解像度の時は点線が完全につぶれてしまう！
	// よって、FFTで破線を検出するという戦略は破綻している
	// 水色のピクセルは破線に加えてエリア注記文字も、長期に渡り、解像度が異なっても、地図上の位が安定している様子
	// 
	// 2023/8/10 そこで、FFTをあきらめ、これをマーカーにして補正する　ただし右上のレポート文字が同じ色のケースがあるので、ここを外しクリップする
	// さらに大ISSUE 注記の水色文字の場所が変わってしまう・・　abpwsair_2023081619.jpg　参照　やはり点線認識か・・？
	//
	// 2026/09/22 さらに改良してテストを開始
	// 1. X方向: 水色の縦線(100E, 180)から正確な経度スケールとオフセットを算出。
	// 2. Y方向: 水色の横線(赤道)を起点とし、白い緯線の周期をコムフィルタで解析して、
	//           X方向とは異なる独自の緯度スケール(アスペクト比のズレ)を正確に算出。

		var corsPxy = "ProxieForNonSvgMapEnv";
		
		addEventListener("layerWebAppReady", function () {
			getMapRefernces(function(ri){
				var gTop = (0 + ri.lat0 / (ri.lat10span/10));
				var gBtm = (0 - (ri.imageHeight - ri.lat0) / (ri.lat10span/10));
				
				console.log("=== 最終適用パラメータ ===");
				console.log("gTop(緯度):", gTop.toFixed(2), "gBtm(緯度):", gBtm.toFixed(2));
				console.log("lonLeft(経度):", ri.lonLeft.toFixed(2), "lonWidth(幅):", ri.lonWidth.toFixed(2));
				
				if (typeof svgMap =="object"){
					var gHeight = gTop - gBtm;
					var timg = svgImage.getElementById("timg");
					
					timg.setAttribute("y", -gTop);
					timg.setAttribute("height", gHeight);
					timg.setAttribute("x", ri.lonLeft);
					timg.setAttribute("width", ri.lonWidth);
					
					svgMap.refreshScreen();
				}
			})
		});
		
		function getMapRefernces(cbf){
			var canvas = document.getElementById("wcanvas");
			var ctx = canvas.getContext("2d", {willReadFrequently: true});
			var img = new Image();
			
			if (typeof svgMap =="object"){
				img.src = svgMap.getCORSURL('https://www.metoc.navy.mil/jtwc/products/abpwsair.jpg');
			} else {
				img.src = corsPxy + "https://www.metoc.navy.mil/jtwc/products/abpwsair.jpg";
			}
			img.setAttribute("crossorigin", "");
			
			img.onload = function () {
				var iw = img.naturalWidth;
				var ih = img.naturalHeight;
				canvas.setAttribute("width", iw);
				canvas.setAttribute("height", ih);
				ctx.drawImage(img, 0, 0);
				var data = ctx.getImageData(0, 0, iw, ih).data;

				// 1. 白いヘッダとフッタの境界を見つける
				var mapTop = 0, mapBottom = ih - 1;
				for (var y = 0; y < ih / 2; y++) {
					var w = 0, total = 0;
					for (var x = 0; x < iw; x += 10) {
						var pi = (y * iw + x) * 4;
						if (data[pi] > 230 && data[pi+1] > 230 && data[pi+2] > 230) w++;
						total++;
					}
					if (w / total < 0.5) { mapTop = y; break; }
				}
				for (var y = ih - 1; y > ih / 2; y--) {
					var w = 0, total = 0;
					for (var x = 0; x < iw; x += 10) {
						var pi = (y * iw + x) * 4;
						if (data[pi] > 230 && data[pi+1] > 230 && data[pi+2] > 230) w++;
						total++;
					}
					if (w / total < 0.5) { mapBottom = y; break; }
				}
				var mapH = mapBottom - mapTop + 1;
				
				// 2. 水色ピクセルの検出
				var cyanX = new Array(iw).fill(0);
				var cyanY = new Array(ih).fill(0);
				for (var y = mapTop; y <= mapBottom; y++) {
					for (var x = 0; x < iw; x++) {
						var pi = (y * iw + x) * 4;
						var hsv = rgb2hsv(data[pi], data[pi+1], data[pi+2]);
						if (Math.abs(hsv.h - 196) < 15 && hsv.s > 60 && hsv.v > 60) {
							cyanX[x]++;
							cyanY[y]++;
						}
					}
				}

				// 3. Y方向のピーク ＝ 赤道 (0度)
				var py_0d = mapTop;
				var maxCY = 0;
				for (var y = mapTop; y <= mapBottom; y++) {
					if (cyanY[y] > maxCY) { maxCY = cyanY[y]; py_0d = y; }
				}

				// 4. X方向のピーク ＝ 100E と 180W
				var peaks = [];
				for (var x = 1; x < iw - 1; x++) {
					if (cyanX[x] > cyanX[x-1] && cyanX[x] >= cyanX[x+1] && cyanX[x] > mapH * 0.05) {
						peaks.push({x: x, val: cyanX[x]});
					}
				}
				peaks.sort(function(a, b){ return b.val - a.val; });

				var selectedPeaks = [];
				for (var i = 0; i < peaks.length; i++) {
					var p = peaks[i];
					var tooClose = false;
					for (var j = 0; j < selectedPeaks.length; j++) {
						if (Math.abs(p.x - selectedPeaks[j].x) < iw * 0.1) { tooClose = true; break; }
					}
					if (!tooClose) {
						selectedPeaks.push(p);
						if (selectedPeaks.length === 2) break;
					}
				}
				selectedPeaks.sort(function(a, b){ return a.x - b.x; });

				var pxPerDeg = 0;
				var lonLeft = 0;
				if (selectedPeaks.length === 2) {
					var px_100E = selectedPeaks[0].x;
					var px_180 = selectedPeaks[1].x;
					pxPerDeg = (px_180 - px_100E) / 80.0;
					lonLeft = 100 - (px_100E / pxPerDeg);
				} else {
					pxPerDeg = iw / 201.32786951645718;
					lonLeft = selectedPeaks.length === 1 ? 100 - (selectedPeaks[0].x / pxPerDeg) : 18.5;
				}

				// 5. 【改良】Y方向独自の10度ピッチ(spanY)をコムフィルタで特定
				var minSpanY = pxPerDeg * 8; // X方向スケールの0.8倍〜1.5倍の範囲を探る
				var maxSpanY = pxPerDeg * 15;
				
				var edgeY = new Float32Array(ih);
				for (var y = mapTop + 1; y < mapBottom - 1; y++) {
					var sumEdge = 0;
					for (var x = 0; x < iw; x += 3) {
						var pi = (y * iw + x) * 4;
						var pi_up = ((y - 2) * iw + x) * 4; 
						
						var v = data[pi] + data[pi+1] + data[pi+2]; 
						var v_up = data[pi_up] + data[pi_up+1] + data[pi_up+2];
						
						// 雲を避け、緯線特有の「白っぽくて水平なエッジ」を抽出
						if (v > 450 && v - v_up > 50) {
							sumEdge += (v - v_up);
						}
					}
					edgeY[y] = sumEdge;
				}

				var bestSpanY = pxPerDeg * 10;
				var maxScore = -1;

				// 赤道から sy ピッチで等間隔にサンプリングし、最も緯線に重なる周期を探す
				for (var sy = minSpanY; sy <= maxSpanY; sy += 0.2) {
					var score = 0, count = 0;
					
					// 北半球側
					for (var step = 1; ; step++) {
						var ty = Math.round(py_0d - step * sy);
						if (ty < mapTop + 10) break;
						var val = Math.max(edgeY[ty-1] || 0, edgeY[ty], edgeY[ty+1] || 0);
						score += val;
						count++;
					}
					// 南半球側
					for (var step = 1; ; step++) {
						var ty = Math.round(py_0d + step * sy);
						if (ty > mapBottom - 10) break;
						var val = Math.max(edgeY[ty-1] || 0, edgeY[ty], edgeY[ty+1] || 0);
						score += val;
						count++;
					}
					
					if (count > 0) {
						var avgScore = score / count;
						if (avgScore > maxScore) {
							maxScore = avgScore;
							bestSpanY = sy;
						}
					}
				}
				
				console.log("X方向 10度ピッチ:", (pxPerDeg * 10).toFixed(2));
				console.log("Y方向 10度ピッチ(コムフィルタ検出):", bestSpanY.toFixed(2));

				var lonWidth = iw / pxPerDeg;

				cbf({
					lat0: py_0d, 
					lat10span: bestSpanY, // 独立算出したYスケールを適用
					imageHeight: ih,
					lonLeft: lonLeft,
					lonWidth: lonWidth
				});
			};
		};
		
		function rgb2hsv(r, g, b) {
			var max = Math.max(r, g, b), min = Math.min(r, g, b);
			var hsv = { h: 0, s: 0, v: max }; 
			if (max != min) {
				if (max == r) hsv.h = (60 * (g - b)) / (max - min);
				if (max == g) hsv.h = (60 * (b - r)) / (max - min) + 120;
				if (max == b) hsv.h = (60 * (r - g)) / (max - min) + 240;
				hsv.s = (max - min) / max;
			}
			if (hsv.h < 0) hsv.h += 360;
			hsv.h = Math.round(hsv.h);
			hsv.s = Math.round(hsv.s * 100);
			hsv.v = Math.round((hsv.v / 255) * 100);
			return hsv;
		}
	</script>
	<body>
		<h4><a href="https://www.metoc.navy.mil/jtwc/jtwc.html" target="_blank">JOINT TYPHOON WARNING CENTER</a> Layer</h4>
		<canvas id="wcanvas" width="400" height="300" style="display: none"></canvas>
	</body>
</html>
