<!doctype html>
<html>
<head>
	<meta charset="utf-8"/>
	<title>rent a car data parser</title>
	<!-- PDFをブラウザ上で画像化するためのPDF.jsを読み込み -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
</head>

<style>
/* 奇数行のスタイル */
table tr:nth-child(odd){
  background-color:#c0c0ff;
}
 
/* 偶数行のスタイル */
table tr:nth-child(even){
  background-color:#e0e0e0;
}
</style>

<script src="https://cdn.jsdelivr.net/gh/svgmap/svgmapjs@latest/svgMapLayerLib.js"></script>
<script>
// Description:
// 気象庁天気図を表示するSVGMapレイヤー
// 
//  Programmed by Satoru Takagi

//
// History:
// 2022/04/05 初版
// 2026/09/27 アジア太平洋域を選択可能に
// 2026/09/27 PDF版(高解像度)の動的レンダリング機能を追加

// PDF.jsのWorker設定
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js';

var proxyPath="https://www.jma.go.jp/bosai/";
var tenkizuInfoSubPath="weather_map/data/list.json";
var tenkizuPngSubPath="weather_map/data/png/";

var allTenkiData = null;
var currentArea = "near";

addEventListener("layerWebAppReady", function(){
	console.log("tenkizuController:layerWebAppReady: ");
	loadJSON(showTenkizu, proxyPath + tenkizuInfoSubPath);
});

var tenkiInfo;
function showTenkizu(json){
	if (json) allTenkiData = json;
	console.log(allTenkiData);
	
	var tenkiSelect = document.getElementById("tenkiSelect");
	removeChildren(tenkiSelect);
	
	// 高解像度版が選ばれている場合はベースとして"asia"のデータを参照
	var targetAreaKey = (currentArea === "asia_highres") ? "asia" : currentArea;
	
	tenkiInfo = allTenkiData[targetAreaKey].now;
	tenki = tenkiInfo[tenkiInfo.length-1];
	console.log(tenki);
	
	changeTenki(proxyPath + tenkizuPngSubPath + tenki);
	
	if ( typeof(svgImageProps)=="object" && svgImageProps.Path.indexOf("noforecast")>0){
		console.log("予報表示を抑制します・・");
	} else {
		// 高解像度PDFでも予想図が存在するため、そのままプルダウンに追加
		if (allTenkiData[targetAreaKey].ft48) buildOptions(allTenkiData[targetAreaKey].ft48,"48時間");
		if (allTenkiData[targetAreaKey].ft24) buildOptions(allTenkiData[targetAreaKey].ft24,"24時間");
	}
	
	// 実況のプルダウン構築（高解像度の場合は実況は過去分がないため最新1件のみ）
	if (currentArea === "asia_highres") {
		buildOptions([tenki]);
	} else {
		buildOptions(tenkiInfo);
	}
}

function buildOptions(js,isFuture){
	var isFirst=true;
	var tenkiSelect = document.getElementById("tenkiSelect");
	for ( var i = js.length-1 ; i >= 0 ; i--){
		var oi =js[i];
		var opt = document.createElement("option");
		opt.value=oi;
		var di;
		if ( !isFuture){
			var ts = oi.split("_")[6];
			var ds=new Date(Date.UTC(ts.substring(0,4),(Number(ts.substring(4,6))-1),ts.substring(6,8),ts.substring(8,10)));
			di = ds.toLocaleString();
			di = di.substring(0,di.length - 6)+"時";
			if (isFirst){
				opt.selected=true;
				isFirst=false;
			}
		} else {
			di = isFuture;
		}
		opt.innerText=di;
		tenkiSelect.appendChild(opt);
	}
}

function changeArea(event){
	currentArea = event.target.value;
	showTenkizu();
}

function changeTime(event){
	console.log(event.target.selectedIndex,event.target);
	var fn = proxyPath + tenkizuPngSubPath + (event.target.options[event.target.selectedIndex]).value;
	changeTenki(fn);
}

// 非同期関数(async)に変更し、PDFのレンダリングを待てるようにする
async function changeTenki(path){
	var op = svgImage.getElementById("tenkiPng");
	if(op) op.parentNode.removeChild(op);
	
	var im= svgImage.createElement("image");
	
	if (currentArea === "near") {
		// 日本周辺
		im.setAttribute("x", 0);
		im.setAttribute("y", 0);
		im.setAttribute("width", 600);
		im.setAttribute("height", 581);
	} else if (currentArea === "asia") {
		// アジア太平洋域 (軽量PNG版)
		im.setAttribute("x", -360);
		im.setAttribute("y", -294);
		im.setAttribute("width", 1400);
		im.setAttribute("height", 1230);
		im.setAttribute("preserveAspectRatio", "none");
	} else if (currentArea === "asia_highres") {
		// アジア太平洋域 (高解像度PDF版) 
		im.setAttribute("x", -391);
		im.setAttribute("y", -214);
		im.setAttribute("width", 1464);
		im.setAttribute("height", 1078);
		im.setAttribute("preserveAspectRatio", "none");
	}

	if (currentArea === "asia_highres") {
		try {
			console.log("高解像度PDFの取得とレンダリングを開始...");
			
			// パスから読み込むべきPDFを判定
			let targetPdfUrl = "https://www.data.jma.go.jp/yoho/data/wxchart/quick/ASAS_COLOR.pdf"; // デフォルト実況
			if (path.indexOf("fsas24") !== -1) {
				targetPdfUrl = "https://www.data.jma.go.jp/yoho/data/wxchart/quick/FSAS24_COLOR_ASIA.pdf";
			} else if (path.indexOf("fsas48") !== -1) {
				targetPdfUrl = "https://www.data.jma.go.jp/yoho/data/wxchart/quick/FSAS48_COLOR_ASIA.pdf";
			}

			const currentPdfUrl = targetPdfUrl + "?_=" + new Date().getTime();
			const loadingTask = pdfjsLib.getDocument(currentPdfUrl);
			
			const pdfDoc = await loadingTask.promise;
			const page = await pdfDoc.getPage(1);
			
			// 横幅1400pxになるようにスケールを計算して描画
			const originalViewport = page.getViewport({ scale: 1.0 });
			const targetWidth = 1400; 
			const scale = targetWidth / originalViewport.width;
			const viewport = page.getViewport({ scale: scale });
			
			const canvas = document.createElement('canvas');
			const context = canvas.getContext('2d');
			canvas.width = viewport.width;
			canvas.height = viewport.height;
			
			await page.render({
				canvasContext: context,
				viewport: viewport
			}).promise;
			
			// レンダリングしたCanvasをBase64のPNGに変換してSVGのImageに流し込む
			const imgDataUrl = canvas.toDataURL('image/png');
			im.setAttribute("xlink:href", imgDataUrl);
			console.log("PDFから1400px幅の画像生成完了");
			
		} catch (error) {
			console.error("PDFのレンダリングに失敗しました。軽量PNG版にフォールバックします。", error);
			im.setAttribute("xlink:href", path); 
		}
	} else {
		im.setAttribute("xlink:href", path);
	}
	
	im.setAttribute("opacity",0.5);
	im.setAttribute("id","tenkiPng");
	svgImage.documentElement.appendChild(im);
	svgMap.refreshScreen();
}

function loadJSON(cbFunc, url, dataCat, postProcess){
//	console.log("loadJSON : SRC: ", url);
	var httpObj = new XMLHttpRequest();
	if ( httpObj ) {
		httpObj.onreadystatechange = function(){
			loadJSON_ph2( this , cbFunc , dataCat , postProcess);
		} ;
		httpObj.open("GET", url , true );
		httpObj.send(null);
	}
}

function loadJSON_ph2( httpRes , cbFunc , dataCat , postProcess){
	if ( httpRes.readyState == 4 ){
		if ( httpRes.status == 403 || httpRes.status == 404 || httpRes.status == 500 || httpRes.status == 503 ){
			console.log( "loadJSON : File get failed : stat : ", httpRes.status);
			return;
		}
		var jst = httpRes.responseText;
		jst = unescape(jst);
		if ( postProcess ){
			jst = postProcess(jst);
		}
//		console.log("isCsv:",isCsv, "\nloadJSON_ph2:",jst);
		if ( dataCat=="csv" ){
			var csv = jst.split("\n");
//			console.log("csv:",csv);
			for ( var i = 0 ; i < csv.length ; i++ ){
				csv[i] = csv[i].split(",");
			}
//			console.log("csv:",csv);
			cbFunc ( csv );
		} else if ( dataCat == "html" ){
			var parser = new DOMParser();
			var htmlDoc = parser.parseFromString(jst, 'text/html');
			// var htmlDoc = parser.parseFromString(txt, 'text/xml');
			cbFunc(htmlDoc);
		} else {
			var Json = JSON.parse(jst);
			cbFunc(Json);
		}
	}
}

function removeChildren(element){
	while (element.firstChild) element.removeChild(element.firstChild);
}

</script>
<body>
<h3>気象庁天気図レイヤー</h3>
<p style="font-size:12px">出典:<a target="_blank" href="https://www.jma.go.jp/bosai/weather_map/">気象庁ホームページの天気図情報</a>を加工して作成</p>

<select id="areaSelect" onChange="changeArea(event)">
	<option value="near" selected>日本周辺</option>
	<option value="asia">アジア太平洋域</option>
	<option value="asia_highres">アジア太平洋域 (高解像度)</option>
</select>
<select id="tenkiSelect" onChange="changeTime(event)"></select>
</body>
</html>
