<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>沖縄県オープンデータ レイヤ</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 4px;
      color: #15202b;
      background: #ffffff;
      font: 11px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h2 { margin: 0 0 2px; font-size: 14px; color: #7f2704; }
    a { color: #075985; }
    .source { margin: 0 0 5px; font-size: 10px; }
    .controls, .details {
      padding: 5px;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      background: #f6f8fa;
    }
    label { display: block; margin: 0 0 2px; font-weight: 700; }
    input, select {
      width: 100%;
      margin: 0 0 4px;
      padding: 4px;
      border: 1px solid #a8b3bd;
      border-radius: 3px;
      background: #ffffff;
      color: #111827;
      font-size: 11px;
    }
    input:focus, select:focus { outline: 2px solid #fdba74; outline-offset: 0; }
    .action-row { display: flex; gap: 4px; margin: 5px 0; align-items: stretch; }
    #status {
      flex: 1;
      min-width: 0;
      padding: 4px;
      overflow: hidden;
      border: 1px solid #d0d7de;
      border-radius: 3px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }
    #status.loading { color: #374151; background: #f3f4f6; }
    #status.success { color: #166534; background: #dcfce7; border-color: #86efac; }
    #status.filtered { color: #075985; background: #e0f2fe; border-color: #7dd3fc; }
    #status.warning { color: #9a3412; background: #ffedd5; border-color: #fdba74; }
    #status.error { color: #991b1b; background: #fee2e2; border-color: #fca5a5; }
    button {
      padding: 4px 9px;
      border: 0;
      border-radius: 3px;
      background: #334155;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    button:disabled { color: #6b7280; background: #e5e7eb; cursor: not-allowed; }
    .details { display: none; padding: 4px; background: #ffffff; }
    #metaContent { margin-bottom: 3px; font-size: 9px; color: #374151; }
    #notesContent {
      max-height: 82px;
      padding: 3px;
      overflow: auto;
      border: 1px solid #e5e7eb;
      border-radius: 2px;
      background: #f9fafb;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 10px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/gh/svgmap/svgmapjs@latest/svgMapLayerLib.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script type="module" src="okinawaOpenData.js"></script>
</head>
<body>
  <h2>沖縄県オープンデータ レイヤ</h2>
  <p class="source">
    出典：<a href="https://data.bodik.jp/organization/470007" target="_blank" rel="noopener">沖縄県オープンデータカタログ</a>
  </p>

  <div class="controls">
    <label for="filterInput">キーワード検索（空白区切りAND）</label>
    <input id="filterInput" type="search" placeholder="例：医療 観光" disabled>

    <label for="datasetList">緯度・経度または住所を持つデータセット</label>
    <select id="datasetList" disabled>
      <option value="">メタデータ読込中...</option>
    </select>

    <label for="resourceList">データファイル</label>
    <select id="resourceList" disabled>
      <option value="">データセットを選択してください</option>
    </select>
  </div>

  <div class="action-row">
    <div id="status" class="loading" role="status">LaWA初期化中...</div>
    <button id="downloadBtn" type="button" disabled>正規化CSV</button>
  </div>

  <section id="details" class="details" aria-label="データセット詳細">
    <div id="metaContent"></div>
    <div id="notesContent"></div>
  </section>
</body>
</html>
