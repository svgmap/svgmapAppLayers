<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>通いの場 LaWA ブラウザーテスト</title>
</head>
<body>
<script type="module">
  const appHtml = await (await fetch("../kayoinoba.html")).text();
  const parsedApp = new DOMParser().parseFromString(appHtml, "text/html");
  for (const style of parsedApp.head.querySelectorAll("style")) {
    document.head.append(document.importNode(style, true));
  }
  document.body.replaceChildren(
    ...[...parsedApp.body.childNodes].map((node) =>
      document.importNode(node, true)
    )
  );

  const diagnostics = document.createElement("section");
  diagnostics.style.cssText =
    "margin-top:12px;padding:8px;border:2px dashed #567;background:#eef6fa";
  diagnostics.setAttribute("aria-label", "ブラウザーテスト操作");
  diagnostics.innerHTML = `
    <h2>ブラウザーテスト操作</h2>
    <button id="harnessZoomTokyo" type="button">東京へ拡大</button>
    <button id="harnessShowDetail" type="button">地点詳細を模擬表示</button>
    <button id="harnessFailNext" type="button">次の再読込を失敗させる</button>
    <p id="harnessReport" role="status">初期化中</p>
    <div id="harnessModal"></div>`;
  document.body.append(diagnostics);

  const svgText = await (await fetch("../kayoinoba.svg")).text();
  window.svgImage = new DOMParser().parseFromString(svgText, "image/svg+xml");
  window.svgImageProps = { scale: 0.1, hash: "" };
  window.layerID = "kayoinoba-browser-test";
  let geoViewBox = { x: 122, y: 20, width: 32, height: 26 };
  let poiHandler = null;
  let refreshCount = 0;
  let failNextRequest = false;

  function report() {
    const root = window.svgImage;
    const individual = root.getElementsByTagName("use").length;
    const aggregate = [...root.getElementsByTagName("image")].filter(
      (image) => !image.closest("defs")
    ).length;
    document.getElementById("harnessReport").textContent =
      `refresh ${refreshCount}回・個別記号 ${individual}件・集約画像 ${aggregate}枚`;
  }

  window.svgMap = {
    getCORSURL(url) {
      if (failNextRequest) {
        failNextRequest = false;
        return "/__forced_failure__";
      }
      if (url.includes("kayoinoba_opendata_00002.html")) {
        return "/__kayoinoba_page.html";
      }
      if (url.includes("www.mhlw.go.jp/content/")) {
        return "/__kayoinoba_current.csv";
      }
      return url;
    },
    getGeoViewBox() {
      return geoViewBox;
    },
    refreshScreen() {
      refreshCount += 1;
      queueMicrotask(() => {
        window.preRenderFunction?.();
        report();
      });
    },
    setShowPoiProperty(handler) {
      poiHandler = handler;
    },
    showModal(html) {
      document.getElementById("harnessModal").innerHTML = html;
    }
  };

  document.getElementById("harnessZoomTokyo").addEventListener("click", () => {
    geoViewBox = { x: 139.65, y: 35.6, width: 0.3, height: 0.25 };
    window.svgImageProps.scale = 100;
    window.preRenderFunction?.();
    report();
  });
  document.getElementById("harnessShowDetail").addEventListener("click", () => {
    const target = document.createElement("span");
    target.setAttribute("content", "no-2937");
    poiHandler?.(target);
  });
  document.getElementById("harnessFailNext").addEventListener("click", () => {
    failNextRequest = true;
  });

  await import("../kayoinoba.js?browserHarness=1");
  window.dispatchEvent(new Event("layerWebAppReady"));
</script>
</body>
</html>
